name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # For theme
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Version épinglée et alignée sur netlify.toml : 'latest' rendait les builds
          # non reproductibles et pouvait casser sans qu'aucun commit ne change.
          hugo-version: '0.154.5'
          extended: true
      # Le traitement d'images (redimensionnement des hero) est le poste le plus lourd
      # du build. Sans ce cache, il est refait intégralement à chaque push.
      #
      # continue-on-error : ce cache est une optimisation. Une version précédente
      # utilisait hashFiles('assets/**'), ce qui obligeait le runner à hacher les
      # 208 Mo d'images hero, et son échec bloquait tout le déploiement — GitHub
      # Pages est resté figé sur un build obsolète. Un cache raté doit coûter du
      # temps de build, jamais une mise en ligne.
      - name: Cache Hugo resources
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: resources/_gen
          # Clé sans hachage : on repart toujours du dernier cache disponible et on
          # en écrit un nouveau à chaque commit.
          key: ${{ runner.os }}-hugo-resources-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-
      - name: Build
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4