name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # For theme
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Version épinglée et alignée sur netlify.toml : 'latest' rendait les builds
          # non reproductibles et pouvait casser sans qu'aucun commit ne change.
          hugo-version: '0.154.5'
          extended: true
      # Le traitement d'images (redimensionnement des hero) est le poste le plus lourd
      # du build. Sans ce cache, il est refait intégralement à chaque push.
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**', 'content/**/*.webp') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-
      - name: Build
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4