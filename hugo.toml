disableKinds = ["RSS"]
enableRobotsTXT = true
baseURL = 'https://rctravel.pages.dev/'
theme = "blowfish"
languageCode = "fr"
title = "Romain Charretteur | Photographie de Voyage"

[outputs]
  home = ["HTML", "JSON"]

[params]
  googleAnalytics = "G-9R0TKHM8NV"
  analytics = { provider = "google", id = "G-9R0TKHM8NV" }
  showRecent = false
  mainSections = ["gallery"]
  showDate = false
  showReadingTime = false
  showEdit = false
  showSearch = true
  enableSearch = true
  showSocial = true
  showSocialInHeader = true
  showLanguageSelector = true
  
  # SEO & Social
  description = "Portfolio de photographie de voyage de Romain Charretteur. Découvrez des récits visuels immersifs à travers l'Europe, l'Amérique et l'Asie."
  keywords = ["Romain Charretteur", "Photographe", "Voyage", "Photography", "Montreal", "Brest"]
  
  [params.twitter]
    card = "summary_large_image"
    site = "@romain.charretteur"
    
  [params.opengraph]
    site_name = "Romain Charretteur Photography"
  [params.homepage]
    layout = "card"
    showRecent = true
    showRecentItems = 1000
    showTitle = false
    cardView = true
  [params.gallery]
    enable = true
  [params.article]
    showDate = false
    showReadingTime = false
    showWordCount = false
    showAuthor = false
    showBreadcrumbs = false
    [params.footer]
      showCopyright = false
      showPoweredBy = false

[[params.social]]
  name = "instagram"
  url = "https://www.instagram.com/romain.charretteur"

