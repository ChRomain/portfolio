{{ define "main" }}
<div class="map-page-wrapper">
    <div class="map-container-wrapper">
        <div id="map" style="width: 100%; height: 100%; background: transparent;"></div>
        
        <!-- Dashboard de l'Explorateur -->
        <div id="map-dashboard" class="glass-dashboard animate-fade-in">
            <div class="dashboard-item">
                <span class="dashboard-value" id="stats-countries">0</span>
                <span class="dashboard-label">Pays</span>
            </div>
            <div class="dashboard-divider"></div>
            <div class="dashboard-item">
                <span class="dashboard-value" id="stats-cities">0</span>
                <span class="dashboard-label">Villes</span>
            </div>
            <div class="dashboard-divider"></div>
            <div class="dashboard-item">
                <span class="dashboard-value">{{ if .Site.Data.stats }}+{{ .Site.Data.stats.total_images }}{{ else }}+1200{{ end }}</span>
                <span class="dashboard-label">Photos</span>
            </div>
        </div>

        <!-- Cinematic Journey Timeline -->
        <div id="journey-timeline" class="glass-timeline animate-fade-in">
            <button id="journey-play-pause" class="timeline-play-btn" title="Lancer le voyage">
                <svg id="journey-play-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="journey-pause-icon" class="hidden-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <div id="timeline-track-wrapper">
                <div id="journey-timeline-track"></div>
            </div>
            <div id="journey-current-date" class="timeline-date-display">...</div>
        </div>

        <!-- Travel Card Overlay (Cinematic) -->
        <div id="travel-card" class="travel-card-overlay">
            <div class="travel-card-content">
                <h2 id="travel-card-title">Destination</h2>
                <div id="travel-card-meta">
                    <span id="travel-card-date">Date</span>
                    <span class="meta-dot">•</span>
                    <span id="travel-card-country">Country</span>
                </div>
            </div>
        </div>

        <!-- Bouton Immersion Totale -->
        <button id="map-fullscreen-toggle" class="glass-button animate-fade-in" style="top: 20px;" title="Immersion Totale">
            <svg id="fs-expand-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            <svg id="fs-collapse-icon" class="hidden-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
        </button>

        <!-- Bouton Style de Carte (Satellite) -->
        <button id="map-style-toggle" class="glass-button animate-fade-in" style="top: 75px;" title="Changer de vue">
            <svg id="style-satellite-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <svg id="style-dark-icon" class="hidden-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>
</div>

<!-- Scripts & Styles -->

<!-- Leaflet JS : defer pour ne pas bloquer le rendu -->
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
    (function () {
        const initMap = () => {
            if (typeof L === 'undefined' || typeof L.markerClusterGroup === 'undefined') {
                setTimeout(initMap, 100);
                return;
            }

            const locations = {{ site.Data.locations | default slice | jsonify | safeJS }};

            const map = L.map('map', {
                center: [15, 0], // Starting point (middle of the ocean/world)
                zoom: 1.5,       // Start very far
                minZoom: 2,
                maxBounds: [[-85, -180], [85, 180]],
                scrollWheelZoom: false,
                zoomControl: false,
                attributionControl: false
            });

            // Cinematic Fly-To effect on load
            setTimeout(() => {
                map.flyTo([35, -30], 3, {
                    duration: 3.5,
                    easeLinearity: 0.1
                });
            }, 500);

            // Tile Layers
            const darkTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                opacity: 0.5,
                attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, FAO, NOAA, USGS'
            });

            const satelliteTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            });

            darkTiles.addTo(map);

            // Markers Map for filtering
            const markersMap = new Map();

            // Markers cluster
            const clusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                spiderfyOnMaxZoom: true,
                maxClusterRadius: 50,
                iconCreateFunction: function (cluster) {
                    return L.divIcon({
                        html: '<div class="custom-cluster"><span>' + cluster.getChildCount() + '</span></div>',
                        className: 'marker-cluster-custom',
                        iconSize: L.point(30, 30)
                    });
                }
            });

            locations.forEach(loc => {
                const photoMarkerHtml = `
                    <div class="photo-marker" style="background-image: url('${loc.url}feature.webp');">
                        <div class="photo-marker-border"></div>
                    </div>
                `;

                const marker = L.marker(loc.coords, {
                    icon: L.divIcon({
                        html: photoMarkerHtml,
                        className: 'custom-photo-marker',
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    })
                });

                const tooltipContent = `
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 140px; padding: 6px;">
                        <img src="${loc.url}feature.webp" alt="${loc.name}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);" loading="lazy" onerror="this.style.display='none'">
                        <span style="font-weight: 700; font-size: 0.9rem; letter-spacing: 0.5px;">${loc.name}</span>
                    </div>
                `;

                marker.bindTooltip(tooltipContent, {
                    direction: 'top',
                    className: 'map-tooltip-fancy',
                    offset: [0, -10],
                    interactive: true
                });

                // Redirection fix (Marker or Tooltip click)
                const navigate = () => { window.location.href = loc.url; };
                marker.on('click tap', navigate);
                marker.on('tooltipopen', (e) => {
                    L.DomEvent.on(e.tooltip.getElement(), 'click', navigate);
                });

                clusterGroup.addLayer(marker);
                markersMap.set(loc.url, marker);
            });

            map.addLayer(clusterGroup);

            // Magic Search Filtering Function
            window.filterMapMarkers = (matchingUrls) => {
                locations.forEach(loc => {
                    const marker = markersMap.get(loc.url);
                    if (!marker) return;

                    const isMatch = matchingUrls.length === 0 || matchingUrls.some(url => url.includes(loc.url) || loc.url.includes(url));
                    
                    if (isMatch) {
                        if (!clusterGroup.hasLayer(marker)) clusterGroup.addLayer(marker);
                    } else {
                        if (clusterGroup.hasLayer(marker)) clusterGroup.removeLayer(marker);
                    }
                });
            };

            // GeoJSON Borders
            const getGeoJsonStyle = () => ({
                fillColor: map.hasLayer(satelliteTiles) ? "transparent" : "#353535",
                weight: map.hasLayer(satelliteTiles) ? 1.5 : 0.8,
                color: map.hasLayer(satelliteTiles) ? "rgba(255,255,255,0.4)" : "#555",
                fillOpacity: map.hasLayer(satelliteTiles) ? 0 : 1
            });

            const geoJsonLayer = L.geoJSON(null, {
                style: getGeoJsonStyle
            }).addTo(map);

            fetch('https://cdn.jsdelivr.net/gh/datasets/geo-boundaries-world-110m@master/countries.geojson')
                .then(r => r.json())
                .then(data => {
                    geoJsonLayer.addData(data);
                    geoJsonLayer.bringToBack();
                }).catch(() => { });

            // 3. Zoom control in bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // 4. Update Dashboard Stats
            const uniqueCountries = new Set(locations.map(l => l.country)).size;
            document.getElementById('stats-countries').textContent = uniqueCountries;
            document.getElementById('stats-cities').textContent = locations.length;

            // 5. Fullscreen Logic
            const fsBtn = document.getElementById('map-fullscreen-toggle');
            const fsContainer = document.querySelector('.map-container-wrapper');
            const expandIcon = document.getElementById('fs-expand-icon');
            const collapseIcon = document.getElementById('fs-collapse-icon');

            const updateFSUI = (isFullscreen) => {
                if (isFullscreen) {
                    expandIcon.classList.add('hidden-icon');
                    collapseIcon.classList.remove('hidden-icon');
                    fsContainer.classList.add('is-fullscreen');
                    document.body.style.overflow = 'hidden'; // Block background scroll
                } else {
                    expandIcon.classList.remove('hidden-icon');
                    collapseIcon.classList.add('hidden-icon');
                    fsContainer.classList.remove('is-fullscreen');
                    fsContainer.classList.remove('is-pseudo-fullscreen');
                    document.body.style.overflow = '';
                }
                setTimeout(() => map.invalidateSize(), 300);
            };

            const toggleFullscreen = () => {
                const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
                const isPseudo = fsContainer.classList.contains('is-pseudo-fullscreen');

                if (!fsElement && !isPseudo) {
                    if (fsContainer.requestFullscreen) {
                        fsContainer.requestFullscreen();
                    } else if (fsContainer.webkitRequestFullscreen) {
                        fsContainer.webkitRequestFullscreen();
                    } else {
                        // iOS / Pseudo-fullscreen Fallback
                        fsContainer.classList.add('is-pseudo-fullscreen');
                        updateFSUI(true);
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (isPseudo) {
                        updateFSUI(false);
                    }
                }
            };

            fsBtn.addEventListener('click', toggleFullscreen);

            // 6. Style Toggle Logic
            const styleBtn = document.getElementById('map-style-toggle');
            const satIcon = document.getElementById('style-satellite-icon');
            const moonIcon = document.getElementById('style-dark-icon');

            styleBtn.addEventListener('click', () => {
                const isSatellite = map.hasLayer(satelliteTiles);
                if (!isSatellite) {
                    map.removeLayer(darkTiles);
                    satelliteTiles.addTo(map);
                    satelliteTiles.bringToBack();
                    satIcon.classList.add('hidden-icon');
                    moonIcon.classList.remove('hidden-icon');
                } else {
                    map.removeLayer(satelliteTiles);
                    darkTiles.addTo(map);
                    darkTiles.bringToBack();
                    satIcon.classList.remove('hidden-icon');
                    moonIcon.classList.add('hidden-icon');
                }
                geoJsonLayer.setStyle(getGeoJsonStyle()); // Proper style update
                if (geoJsonLayer) geoJsonLayer.bringToBack();
            });

            ['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
                document.addEventListener(evt, () => {
                    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    updateFSUI(isFS);
                });
            });

            // Fix for map resizing
            setTimeout(() => map.invalidateSize(), 500);

            // --- 7. Journey Autopilot Logic ---
            const journeyPlayBtn = document.getElementById('journey-play-pause');
            const journeyPlayIcon = document.getElementById('journey-play-icon');
            const journeyPauseIcon = document.getElementById('journey-pause-icon');
            const journeyTrack = document.getElementById('journey-timeline-track');
            const dateDisplay = document.getElementById('journey-current-date');
            const travelCard = document.getElementById('travel-card');
            
            let currentJourneyIndex = -1;
            let isJourneyPlaying = false;
            let journeyTimeout = null;

            // Sort locations by date (just in case)
            const sortedLocs = [...locations].sort((a, b) => new Date(a.date) - new Date(b.date));

            // Create timeline bubbles
            sortedLocs.forEach((loc, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'timeline-bubble';
                bubble.title = `${loc.name} (${new Date(loc.date).toLocaleDateString()})`;
                bubble.addEventListener('click', () => {
                    stopJourney();
                    jumpToJourneyStep(index);
                });
                journeyTrack.appendChild(bubble);
            });

            function jumpToJourneyStep(index) {
                if (index < 0 || index >= sortedLocs.length) return;
                currentJourneyIndex = index;
                const loc = sortedLocs[index];
                
                // Update Timeline UI
                const bubbles = document.querySelectorAll('.timeline-bubble');
                bubbles.forEach((b, i) => {
                    b.classList.toggle('active', i === index);
                    b.classList.toggle('passed', i < index);
                });

                // Update date display
                const tripDate = new Date(loc.date);
                dateDisplay.textContent = tripDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

                // Fly to destination
                map.flyTo(loc.coords, 8, {
                    duration: 2.5,
                    easeLinearity: 0.25
                });

                // Show Travel Card
                setTimeout(() => {
                    showTravelCard(loc);
                }, 1500);

                if (isJourneyPlaying) {
                    journeyTimeout = setTimeout(() => {
                        if (currentJourneyIndex < sortedLocs.length - 1) {
                            jumpToJourneyStep(currentJourneyIndex + 1);
                        } else {
                            stopJourney();
                        }
                    }, 6000); // 2.5s flight + 3.5s pause
                }
            }

            function showTravelCard(loc) {
                document.getElementById('travel-card-title').textContent = loc.name;
                document.getElementById('travel-card-country').textContent = loc.country;
                document.getElementById('travel-card-date').textContent = new Date(loc.date).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
                
                travelCard.classList.add('visible');
                setTimeout(() => {
                    travelCard.classList.remove('visible');
                }, 4000);
            }

            function startJourney() {
                isJourneyPlaying = true;
                journeyPlayIcon.classList.add('hidden-icon');
                journeyPauseIcon.classList.remove('hidden-icon');
                
                if (currentJourneyIndex >= sortedLocs.length - 1) {
                    currentJourneyIndex = -1;
                }
                jumpToJourneyStep(currentJourneyIndex + 1);
            }

            function stopJourney() {
                isJourneyPlaying = false;
                journeyPlayIcon.classList.remove('hidden-icon');
                journeyPauseIcon.classList.add('hidden-icon');
                if (journeyTimeout) clearTimeout(journeyTimeout);
            }

            journeyPlayBtn.addEventListener('click', () => {
                if (isJourneyPlaying) stopJourney();
                else startJourney();
            });
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            initMap();
        }
    })();
</script>
