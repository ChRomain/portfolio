{{ define "main" }}
<div style="width: 100%; max-width: 1200px; margin: 20px auto; padding: 0 20px;">
  <div style="display: flex !important; flex-wrap: wrap !important; gap: 15px !important; justify-content: center !important;">
    
    {{ range (where .Site.RegularPages "Section" "gallery") }}
    {{ $image := .Resources.GetMatch "feature*" }}
    <a href="{{ .Permalink }}" 
       style="display: flex !important; align-items: center; justify-content: center; 
              width: 250px !important; height: 60px !important; 
              border-radius: 12px; border: 1px solid #3f3f46; 
              position: relative; overflow: hidden;
              background-color: #1e1f20; color: white; 
              text-decoration: none; font-weight: bold; font-size: 0.95rem;
              transition: transform 0.2s ease;">
      
      {{ with $image }}
      {{ $placeholder := .Fill "250x60" }}
      <div style="position: absolute; top:0; left:0; width:100%; height:100%; 
                  background-image: url('{{ $placeholder.RelPermalink }}'); 
                  background-size: cover; background-position: center; filter: brightness(0.5); z-index: 1;">
      </div>
      {{ end }}

      <span style="position: relative; z-index: 2; text-shadow: 1px 1px 4px rgba(0,0,0,0.8);">
        {{ .Title }}
      </span>
    </a>
    {{ end }}

  </div>
</div>

<style>
  a:hover { transform: scale(1.05); border-color: #6366f1 !important; }
  a:hover div { filter: brightness(0.7) !important; }
</style>
{{ end }}
