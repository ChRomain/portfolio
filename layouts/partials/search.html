<div
  id="search-wrapper"
  class="hidden fixed inset-0 h-screen w-screen cursor-default flex-col bg-neutral-100/10 p-4 backdrop-blur-xl dark:bg-neutral-900/10 sm:p-6 md:p-[15vh] lg:p-[20vh]"
  style="z-index: 2147483647;"
  data-url="{{ "" | absLangURL }}">
  <div
    id="search-modal"
    class="flex flex-col w-full max-w-lg min-h-0 mx-auto transition-all duration-500 transform scale-95 opacity-0">
    
    <header class="relative z-10 flex items-center mb-8">
      <form class="flex items-center flex-auto min-w-0 bg-white/60 dark:bg-neutral-800/60 rounded-full px-5 shadow-sm border border-neutral-200/30 dark:border-neutral-700/30">
        <div class="flex items-center justify-center w-6 h-6 text-neutral-400">
           <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input
          type="search"
          id="search-query"
          class="flex flex-auto h-12 mx-3 bg-transparent appearance-none focus:outline-none text-base font-light placeholder-neutral-400 dark:placeholder-neutral-500 border-none"
          placeholder="Rechercher..."
          tabindex="0">
      </form>
    </header>

    <section class="flex-auto overflow-auto max-h-[50vh] custom-scrollbar px-2">
      <ul id="search-results" class="space-y-1">
        <!-- Results -->
      </ul>
      <div id="search-empty-state" class="flex flex-col items-center justify-center py-10 text-neutral-400 dark:text-neutral-500 hidden font-light text-sm italic">
          <p>Aucun cliché trouvé</p>
      </div>
    </section>
  </div>
</div>

<style>
#search-modal.active {
    transform: scale(1);
    opacity: 1;
}
#search-modal *, 
#search-modal a, 
#search-modal span,
#search-modal div {
    text-decoration: none !important;
    text-decoration-line: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
    outline: none !important;
}
.search-result-item a:hover {
    background: rgba(120, 120, 120, 0.05) !important;
    text-decoration: none !important;
}
.search-result-item .mood-tag {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(120, 120, 120, 0.1);
    color: #888;
    margin-right: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.search-result-item .color-preview {
    width: 10px;
    height: 10px;
    border-radius: 2px;
}
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.2); border-radius: 10px; }
</style>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const searchWrapper = document.getElementById('search-wrapper');
    const searchModal = document.getElementById('search-modal');
    const searchButtonGlobal = document.getElementById('search-button-global');
    const searchButtonMobile = document.getElementById('search-button-mobile');
    const closeButton = document.getElementById('close-search-button');
    const searchQuery = document.getElementById('search-query');
    const searchResults = document.getElementById('search-results');
    const emptyState = document.getElementById('search-empty-state');
    
    let fuse = null;
    let searchData = [];

    // Toggle Modal
    const toggleSearch = (show) => {
        console.log("Magic Search: Toggling to", show);
        if (!searchWrapper || !searchModal) {
            console.error("Magic Search: Elements missing!", {wrapper: !!searchWrapper, modal: !!searchModal});
            return;
        }

        if (show) {
            searchWrapper.classList.remove('hidden');
            searchWrapper.classList.add('flex');
            searchWrapper.style.display = 'flex'; // Force display
            setTimeout(() => {
                searchModal.classList.add('active');
                if (searchQuery) searchQuery.focus();
            }, 50);
        } else {
            searchModal.classList.remove('active');
            setTimeout(() => {
                searchWrapper.classList.add('hidden');
                searchWrapper.classList.remove('flex');
                searchWrapper.style.display = 'none';
            }, 300);
        }
    };

    console.log("Magic Search: Script loaded. Global button:", !!searchButtonGlobal);
    if (searchButtonGlobal) searchButtonGlobal.addEventListener('click', (e) => {
        e.preventDefault();
        toggleSearch(true);
    });

    if (searchButtonMobile) searchButtonMobile.addEventListener('click', () => {
        const mobileOverlay = document.getElementById('mobile-menu-overlay');
        if (mobileOverlay) {
            mobileOverlay.classList.add('hidden');
            mobileOverlay.classList.remove('flex');
            document.body.style.overflow = '';
        }
        toggleSearch(true);
    });

    if (closeButton) closeButton.addEventListener('click', () => toggleSearch(false));
    
    // Close when clicking outside the modal
    searchWrapper.addEventListener('click', (e) => {
        if (e.target === searchWrapper) {
            toggleSearch(false);
        }
    });
    
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') toggleSearch(false);
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            toggleSearch(true);
        }
        if (e.key === 'Enter' && !searchWrapper.classList.contains('hidden')) {
            const firstResult = searchResults.querySelector('a');
            if (firstResult) {
                e.preventDefault();
                window.location.href = firstResult.href;
            }
        }
    });
    
    // Also load data immediately
    loadSearchData();

    async function loadSearchData() {
        if (fuse) return;
        const queryInput = document.getElementById('search-query');
        if (queryInput) queryInput.placeholder = "Chargement de la magie...";
        
        console.log("Magic Search: Loading index...");
        const url = searchWrapper.getAttribute('data-url') + 'index.json';
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Fichier index.json introuvable. Lancez sync_photos.py !");
            searchData = await res.json();
            
            if (typeof Fuse === 'undefined') {
                console.warn("Magic Search: Fuse.js not found, loading from CDN...");
                const module = await import('https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.esm.js');
                window.Fuse = module.default;
            }

            fuse = new Fuse(searchData, {
                keys: ['title', 'summary', 'tags', 'content'],
                threshold: 0.3,
                includeMatches: true
            });
            if (queryInput) queryInput.placeholder = "Recherche Magique : Sunset, Blue...";
            console.log("Magic Search: Index loaded successfully.");
        } catch (err) {
            console.error("Magic Search: Error loading index", err);
            if (queryInput) queryInput.placeholder = "⚠️ Erreur : Lancez sync_photos.py !";
        }
    }

    searchQuery.addEventListener('input', () => {
        const query = searchQuery.value.trim();
        if (!fuse || query.length < 2) {
            searchResults.innerHTML = '';
            emptyState.classList.add('hidden');
            // Reset markers if on map page
            if (window.filterMapMarkers) window.filterMapMarkers([]);
            return;
        }

        const results = fuse.search(query);
        renderResults(results);
        
        // --- Map Syncing ---
        if (window.filterMapMarkers) {
            const matchingUrls = results.map(r => r.item.permalink);
            window.filterMapMarkers(matchingUrls);
        }
    });

    function renderResults(results) {
        if (results.length === 0) {
            searchResults.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        searchResults.innerHTML = results.slice(0, 10).map(res => {
            const item = res.item;
            const tags = (item.tags || []).map(t => `<span class="mood-tag">${t}</span>`).join('');
            const colorCircle = item.color ? `<div class="color-preview" style="background: ${item.color}" title="Ambience dominant: ${item.color}"></div>` : '';
            
            return `
                <li class="search-result-item" style="text-decoration: none !important;">
                    <a href="${item.permalink}" class="flex items-center p-4 rounded-2xl bg-white dark:bg-neutral-800 border border-neutral-100 dark:border-neutral-700 hover:border-primary-500 transition-all group shadow-sm no-underline" style="text-decoration: none !important; border-bottom: none !important; box-shadow: none !important;">
                        <div class="mr-4 flex-shrink-0" style="text-decoration: none !important;">
                            <div class="w-12 h-12 rounded-xl bg-neutral-100 dark:bg-neutral-700 flex items-center justify-center overflow-hidden" style="text-decoration: none !important;">
                                ${colorCircle || '<svg class="w-6 h-6 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>'}
                            </div>
                        </div>
                        <div class="grow min-w-0" style="text-decoration: none !important;">
                            <div class="flex items-center gap-2 mb-1" style="text-decoration: none !important;">
                                <span class="text-xs font-bold text-primary-500 uppercase tracking-tighter no-underline" style="text-decoration: none !important; border-bottom: none !important;">${item.section}</span>
                                ${tags}
                            </div>
                            <div class="text-base font-bold text-neutral-800 dark:text-neutral-100 group-hover:text-primary-500 transition-colors truncate no-underline" style="text-decoration: none !important;">${item.title}</div>
                            <div class="text-xs text-neutral-500 italic truncate no-underline" style="text-decoration: none !important;">${item.summary || ''}</div>
                        </div>
                        <div class="ml-4 text-neutral-300 group-hover:text-primary-500 transition-transform group-hover:translate-x-1" style="text-decoration: none !important;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 5l7 7-7 7M5 12h14"/></svg>
                        </div>
                    </a>
                </li>
            `;
        }).join('');
    }
});
</script>
