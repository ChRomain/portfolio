<div id="weather-clock-widget" style="display: none; visibility: visible;" class="group relative items-center gap-3 px-4 py-2 rounded-full glass-weather-nav text-sm font-medium transition-all duration-500 hover:scale-105 cursor-pointer">
    <div id="weather-icon-container" class="flex items-center">
        <svg class="animate-spin h-4 w-4 text-neutral-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </div>
    <div id="weather-temp" class="text-neutral-800 dark:text-neutral-200">--°C</div>
    <div class="h-4 w-px bg-neutral-300 dark:bg-neutral-700"></div>
    <div id="local-clock" class="text-neutral-600 dark:text-neutral-400 font-mono">--:--</div>


</div>

<script>
(function() {
    const locations = {{ site.Data.locations | default slice | jsonify | safeJS }};
    const currentLang = {{ .Site.Language.Lang | default "en" }};
    const rawURL = window.location.pathname;

    const translations = {
        fr: {
            loading: "Chargement...",
            weather: "Météo locale à {city} : {desc}",
            feelsLike: "Ressenti",
            clear: "Ciel dégagé",
            cloudy: "Nuageux",
            foggy: "Brouillard",
            drizzle: "Bruine",
            rain: "Pluie",
            snow: "Neige",
            showers: "Averses",
            storm: "Orages"
        },
        en: {
            loading: "Loading...",
            weather: "Local weather in {city}: {desc}",
            feelsLike: "Feels like",
            clear: "Clear sky",
            cloudy: "Cloudy",
            foggy: "Foggy",
            drizzle: "Drizzle",
            rain: "Rain",
            snow: "Snow",
            showers: "Showers",
            storm: "Thunderstorms"
        },
        es: {
            loading: "Cargando...",
            weather: "Tiempo local en {city}: {desc}",
            feelsLike: "Sensación",
            clear: "Cielo despejado",
            cloudy: "Nublado",
            foggy: "Niebla",
            drizzle: "Llovizna",
            rain: "Lluvia",
            snow: "Nieve",
            showers: "Chubascos",
            storm: "Tormentas"
        }
    };

    const t = translations[currentLang] || translations.en;


    // Normalize URL
    let searchURL = rawURL;
    const parts = searchURL.split('/').filter(p => p);
    if (parts.length > 0 && ['fr', 'en', 'es'].includes(parts[0])) {
        searchURL = '/' + parts.slice(1).join('/') + '/';
    }
    if (!searchURL.endsWith('/')) searchURL += '/';

    const loc = locations.find(l => {
        const lUrl = l.url.endsWith('/') ? l.url : l.url + '/';
        return lUrl === searchURL || searchURL.includes(lUrl) || lUrl.includes(searchURL);
    });

    if (!loc || !loc.coords) return;

    const widget = document.getElementById('weather-clock-widget');
    widget.style.display = 'flex';

    async function updateWeather() {
        const [lat, lng] = loc.coords;
        try {
            const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&timezone=auto`);
            const data = await response.json();
            
            if (data.current_weather) {
                const cw = data.current_weather;
                const temp = Math.round(cw.temperature);
                document.getElementById('weather-temp').textContent = temp + '°C';
                
                // Weather codes classification
                let code = cw.weathercode;
                let conditionText = t.clear;
                let icon = `<svg class="weather-icon-sun" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 4.22l1.42-1.42"/></svg>`;

                if (code >= 1 && code <= 3) {
                    conditionText = t.cloudy;
                    icon = `<svg class="weather-icon-cloud" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`;
                } else if (code === 45 || code === 48) {
                    conditionText = t.foggy;
                    icon = `<svg class="weather-icon-cloud opacity-75" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M5 24h14M3 21h18"/></svg>`;
                } else if (code >= 51 && code <= 55) {
                    conditionText = t.drizzle;
                    icon = `<svg class="weather-icon-rain" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M8 22l-1 2M12 22l-1 2M16 22l-1 2"/></svg>`;
                } else if ((code >= 61 && code <= 65) || (code >= 80 && code <= 82)) {
                    conditionText = code >= 80 ? t.showers : t.rain;
                    icon = `<svg class="weather-icon-rain" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M7 21l-2 3M11 21l-2 3M15 21l-2 3M19 21l-2 3"/></svg>`;
                } else if (code >= 71 && code <= 77) {
                    conditionText = t.snow;
                    icon = `<svg class="weather-icon-snow" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><path d="M12 2v20M2 12h20M5.22 5.22l13.56 13.56M5.22 18.78L18.36 5.64"/></svg>`;
                } else if (code >= 95) {
                    conditionText = t.storm;
                    icon = `<svg class="weather-icon-rain" style="color: #eab308;" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="M13 10l-4 6h3l-2 5"/></svg>`;
                }
                
                document.getElementById('weather-icon-container').innerHTML = icon;



                const updateTime = () => {
                    const now = new Date();
                    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                    const local = new Date(utc + (data.utc_offset_seconds * 1000));
                    document.getElementById('local-clock').textContent = local.getHours().toString().padStart(2, '0') + ':' + local.getMinutes().toString().padStart(2, '0');
                };
                updateTime();
                setInterval(updateTime, 30000);
            }
        } catch (err) {
            console.error("WeatherWidget error:", err);
        }
    }

    updateWeather();
})();
</script>
