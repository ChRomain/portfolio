<div class="portfolio-grid-final">
  {{ $content := .Inner }}
  {{ $content = $content | replaceRE "src=\"gallery/[^/]+/(.*?)\"" "src=\"$1\"" }}
  {{ $content | safeHTML }}
</div>

<!-- Leaflet pour la mini-carte GPS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  .portfolio-grid-final {
    column-count: 4;
    column-gap: 16px;
    width: 100% !important;
    margin: 2rem 0 !important;
    display: block !important;
  }

  .portfolio-grid-final>* {
    break-inside: avoid-column;
    -webkit-column-break-inside: avoid;
    display: inline-block !important;
    vertical-align: top;
    width: 100%;
    margin-top: 0 !important;
    margin-bottom: 16px;
    position: relative !important;
    overflow: hidden !important;
    border-radius: 8px;
    transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s ease;
    will-change: transform, box-shadow;
    z-index: 1;
    perspective: 1000px;
    transform-style: preserve-3d;
  }

  /* Effet de brillance (glare) dynamique */
  .portfolio-grid-final>*::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 50%), rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 2;
  }

  .portfolio-grid-final>*:hover::after {
    opacity: 1;
  }

  .portfolio-grid-final>*:hover {
    z-index: 50 !important;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4) !important;
    border: 1px solid rgba(59, 130, 246, 0.5) !important;
  }

  .portfolio-grid-final img {
    width: 100% !important;
    height: auto !important;
    display: block !important;
    cursor: zoom-in;
    border-radius: 8px;
  }

  @media (max-width: 1200px) {
    .portfolio-grid-final {
      column-count: 3;
    }
  }

  @media (max-width: 768px) {
    .portfolio-grid-final {
      column-count: 2;
      column-gap: 12px;
    }

    .portfolio-grid-final>* {
      margin-bottom: 12px;
    }
  }

  @media (max-width: 480px) {
    .portfolio-grid-final {
      column-count: 1;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // === 1. Injecter le Lightbox si absent ===
    if (!document.getElementById('custom-lightbox')) {
      const lightbox = document.createElement('div');
      lightbox.id = 'custom-lightbox';
      lightbox.innerHTML = `
        <div class="lightbox-nav-top">
          <button id="lightbox-download" aria-label="{{ i18n "aria_download_image" }}">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          </button>
          <button id="lightbox-play-pause" aria-label="{{ i18n "aria_start_slideshow" }}">
            <svg id="play-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <button id="lightbox-info-toggle" aria-label="{{ i18n "aria_show_image_info" }}">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </button>
          <button id="lightbox-fullscreen" aria-label="{{ i18n "aria_toggle_fullscreen" }}">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          </button>
        </div>
        <button id="lightbox-prev" class="lightbox-nav" aria-label="{{ i18n "aria_prev_image" }}">❮</button>
        <div class="lightbox-content">
          <img src="" alt="Full size">
        </div>
        <button id="lightbox-next" class="lightbox-nav" aria-label="{{ i18n "aria_next_image" }}">❯</button>
        
        <div class="lightbox-footer">
          <div id="lightbox-caption" class="hidden-caption"></div>
          <div id="lightbox-exif" class="exif-panel hidden-caption">
            <div id="exif-data-list"></div>
            <div id="exif-map-container" style="display: none; width: 100%; height: 180px; margin-top: 15px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative;">
               <div id="exif-map" style="width: 100%; height: 100%; background: #1a1b1c;"></div>
            </div>
          </div>
          <div id="lightbox-counter"></div>
        </div>
      `;
      document.body.appendChild(lightbox);

      // Fermeture au clic sur le fond (mais pas sur l'image ou boutons)
      lightbox.addEventListener('click', (e) => {
        if (e.target.id === 'custom-lightbox' || e.target.classList.contains('lightbox-content')) {
          closeLightbox();
        }
      });

      // Fermeture avec Echap
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') { stopSlideshow(); showPrev(); }
        if (e.key === 'ArrowRight') { stopSlideshow(); showNext(); }
      });

      // --- GESTES TACTILES ---
      let touchStartX = 0;
      let touchEndX = 0;

      lightbox.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      lightbox.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) { stopSlideshow(); showNext(); }
        if (touchEndX > touchStartX + threshold) { stopSlideshow(); showPrev(); }
      }
    }

    // === 2. Récupérer les éléments ===
    const lightbox = document.getElementById('custom-lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const captionEl = document.getElementById('lightbox-caption');
    const counterEl = document.getElementById('lightbox-counter');
    const prevBtn = document.getElementById('lightbox-prev');
    const nextBtn = document.getElementById('lightbox-next');
    const fullscreenBtn = document.getElementById('lightbox-fullscreen');
    const infoBtn = document.getElementById('lightbox-info-toggle');
    const playBtn = document.getElementById('lightbox-play-pause');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const downloadBtn = document.getElementById('lightbox-download');

    // Récupérer toutes les images de la galerie
    const galleryImages = Array.from(document.querySelectorAll('.portfolio-grid-final img'));
    let currentIndex = 0;
    let slideshowInterval = null;
    let exifMap = null; // Instance unique pour la mini-map GPS

    // === 3. Fonctions de Navigation ===
    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.style.display = 'flex';
      document.body.style.overflow = 'hidden'; 
      document.getElementById('main-header').style.opacity = '0';
      document.getElementById('main-header').style.pointerEvents = 'none';
    }

    function closeLightbox() {
      stopSlideshow();
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      lightbox.style.display = 'none';
      document.body.style.overflow = '';
      document.getElementById('main-header').style.opacity = '1';
      document.getElementById('main-header').style.pointerEvents = 'auto';
      captionEl.classList.add('hidden-caption'); 
      const exifEl = document.getElementById('lightbox-exif');
      if (exifEl) exifEl.classList.add('hidden-caption');
    }

    function updateLightbox() {
      const currentImg = galleryImages[currentIndex];
      lightboxImg.src = currentImg.src;
      lightboxImg.alt = currentImg.alt;

      // Mettre à jour Counter
      counterEl.textContent = `${currentIndex + 1} / ${galleryImages.length}`;

      // Mettre à jour Caption & EXIF
      const captionText = currentImg.getAttribute('title') || currentImg.getAttribute('alt') || '';
      const gpsData = currentImg.getAttribute('data-gps');
      const exifEl = document.getElementById('lightbox-exif');
      const dataListEl = document.getElementById('exif-data-list');
      const mapContainer = document.getElementById('exif-map-container');
      
      if (captionText && captionText.includes(' | ')) {
        captionEl.style.display = 'none';
        exifEl.style.display = 'flex';
        
        const parts = captionText.split(' | ');
        let html = '';
        
        parts.forEach(part => {
          if (part.includes('f/')) {
            html += `<div class="exif-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0Z"/><circle cx="12" cy="12" r="3"/></svg><span>${part}</span></div>`;
          } else if (part.includes('s')) {
            html += `<div class="exif-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>${part}</span></div>`;
          } else if (part.includes('ISO')) {
            html += `<div class="exif-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><span>${part}</span></div>`;
          } else {
            html += `<div class="exif-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>${part}</span></div>`;
          }
        });
        dataListEl.innerHTML = html;

        // Gestion de la Map GPS
        if (gpsData && gpsData.includes(',')) {
          mapContainer.style.display = 'block';
          const [lat, lng] = gpsData.split(',').map(Number);
          
          if (exifMap) {
            exifMap.remove();
          }
          
          exifMap = L.map('exif-map', {
            zoomControl: false,
            attributionControl: false,
            scrollWheelZoom: false,
            dragging: false
          }).setView([lat, lng], 14);
          
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 19
          }).addTo(exifMap);
          
          // Petit point blanc minimaliste
          L.circleMarker([lat, lng], {
            radius: 6,
            fillColor: "#ffffff",
            color: "#6366f1", // Accent color
            weight: 2,
            opacity: 1,
            fillOpacity: 1
          }).addTo(exifMap);
          
          // Refresh needed for container size issues in flex/hidden
          setTimeout(() => exifMap.invalidateSize(), 100);
        } else {
          mapContainer.style.display = 'none';
        }
      } else {
        exifEl.style.display = 'none';
        captionEl.style.display = 'block';
        captionEl.textContent = captionText;
      }
    }

    function showNext() {
      if (galleryImages.length === 0) return;
      currentIndex = (currentIndex + 1) % galleryImages.length; // Boucle au début
      updateLightbox();
    }

    function showPrev() {
      if (galleryImages.length === 0) return;
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length; // Boucle à la fin
      updateLightbox();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        lightbox.requestFullscreen().catch(err => {
          console.error(`Error attempting to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }

    function toggleInfo() {
      captionEl.classList.toggle('hidden-caption');
      const exifEl = document.getElementById('lightbox-exif');
      if (exifEl) exifEl.classList.toggle('hidden-caption');
    }

    function startSlideshow() {
      if (slideshowInterval) return;
      playIcon.classList.add('hidden');
      pauseIcon.classList.remove('hidden');
      slideshowInterval = setInterval(showNext, 3000);
    }

    function stopSlideshow() {
      if (!slideshowInterval) return;
      clearInterval(slideshowInterval);
      slideshowInterval = null;
      playIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
    }

    function toggleSlideshow() {
      if (slideshowInterval) {
        stopSlideshow();
      } else {
        startSlideshow();
      }
    }

    function downloadImage() {
      const imageUrl = lightboxImg.src;
      const fileName = imageUrl.substring(imageUrl.lastIndexOf('/') + 1);
      const link = document.createElement('a');
      link.href = imageUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // === 4. Event Listeners ===

    // Download
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadImage();
    });

    // Slideshow
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSlideshow();
    });

    // Fullscreen
    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });

    // Info toggle
    infoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleInfo();
    });

    // Clic sur les boutons next/prev
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopSlideshow();
      showNext();
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopSlideshow();
      showPrev();
    });

    // Clic sur les images de la galerie
    galleryImages.forEach((img, index) => {
      img.setAttribute('data-zoomable', 'false'); // Désactive zoom natif si présent
      img.classList.remove('zoomable');

      img.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopImmediatePropagation();
        openLightbox(index);
      });
    });

    // === 5. Scroll Reveal Logic (IntersectionObserver) ===
    const revealCallback = (entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target); // Garde l'élément visible une fois révélé
        }
      });
    };

    const revealObserver = new IntersectionObserver(revealCallback, {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px' // Déclenche un peu avant l'entrée complète
    });

    const revealItems = document.querySelectorAll('.portfolio-grid-final > *');
    revealItems.forEach(item => {
      item.classList.add('reveal-item');
      revealObserver.observe(item);

      // === 6. 3D Tilt Effect Logic (Amélioré) ===
      item.addEventListener('mousemove', (e) => {
        const rect = item.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Inclinaison plus légère (divisé par 10 au lieu de 6)
        const rotateX = (centerY - y) / 10;
        const rotateY = (x - centerX) / 10;

        // Brillance (glare)
        const glareX = (x / rect.width) * 100;
        const glareY = (y / rect.height) * 100;
        item.style.setProperty('--glare-x', `${glareX}%`);
        item.style.setProperty('--glare-y', `${glareY}%`);

        // Application immédiate du transform (Zoom plus discret : 1.04 au lieu de 1.1)
        item.style.transition = 'transform 0.1s ease-out';
        item.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.04) translateZ(10px)`;
      });

      item.addEventListener('mouseleave', () => {
        item.style.transition = 'all 0.6s cubic-bezier(0.2, 0, 0.2, 1)';
        item.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1) translateZ(0)`;
      });
    });
  });
</script>
